<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Picker UI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    .btn {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }
    .red { background-color: red; }
    .blue { background-color: blue; }
    .green { background-color: green; }
    #output {
      margin-top: 30px;
      font-size: 20px;
      font-weight: bold;
      border: 2px solid #ccc;
      padding: 15px;
      width: 300px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <h2>Pumili ng Kulay</h2>
  <button class="btn red" onclick="colorfunction(this.value)" value = "red">Red</button>
  <button class="btn blue" onclick ="colorfunction(this.value)" value ="blue">Blue</button>
  <button class="btn green" onclick ="colorfunction(this.value)" value ="green">green</button>

  <div id="output">Wala pang napipili</div>


</body>

<script>
  

  function colorfunction(value){
    if(value === "red"){
        const picked = document.getElementById("output");
        picked.innerHTML = "ang napili mo ay red";
        picked.style.backgroundColor = "red";
    }
     if(value === "blue"){
        const picked = document.getElementById("output");
        picked.innerHTML = "ang napili mo ay blue";
          picked.style.backgroundColor = "blue";
    }
     if(value === "green"){
        const picked = document.getElementById("output");
        picked.innerHTML = "ang napili mo ay green";
          picked.style.backgroundColor = "green";
    }
  }

</script>
</html>
