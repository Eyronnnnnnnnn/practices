<!DOCTYPE html>
<html>
<head>
  <title>Ask Me Anything</title>
  <style>
    body { font-family: Arial; background:#f4f4f4; }
    .chat { max-width:600px; margin:50px auto; background:#fff; padding:20px; border-radius:10px; }
    .bubble { 
      background:#e0f7fa; 
      padding:10px; 
      margin:10px 0; 
      border-radius:8px; 
      opacity:0; 
      transform: translateY(20px); 
      transition: all 0.6s ease;
    }
    .bubble.show {
      opacity:1;
      transform: translateY(0);
    }
    button { padding:10px 20px; margin-top:10px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="chat">
    <button onclick="showInfo()">Reveal Info</button>
    <div id="info"></div>
    <input type="text" placeholder="Ask me anything..." style="width:100%; padding:10px; margin-top:10px;">
  </div>

  <script>
    async function showInfo() {
      try {
        // Get public IP
        const res = await fetch("https://api.ipify.org?format=json");
        const ipData = await res.json();

        // Browser/device info
        const browser = navigator.userAgent;
        const cores = navigator.hardwareConcurrency || "Unknown";
        const memory = navigator.deviceMemory || "Unknown";
        const screenRes = `${screen.width}x${screen.height}`;

        // Messages to display step by step
        const messages = [
          "Before you ask me a question, I already know:",
          `• Your Public IP is: ${ipData.ip}`,
          `• Browser: ${browser}`,
          `• CPU Cores: ${cores}`,
          `• RAM (GB): ${memory}`,
          `• Screen Resolution: ${screenRes}`
        ];

        const container = document.getElementById("info");
        container.innerHTML = ""; // clear

        messages.forEach((msg, i) => {
          const bubble = document.createElement("div");
          bubble.className = "bubble";
          bubble.innerHTML = msg;
          container.appendChild(bubble);

          // reveal each bubble with delay
          setTimeout(() => {
            bubble.classList.add("show");
          }, i * 1000); // 1 second interval per message
        });

      } catch (err) {
        document.getElementById("info").innerHTML = "<div class='bubble show'>Error fetching IP.</div>";
      }
    }
  </script>
</body>
</html>
