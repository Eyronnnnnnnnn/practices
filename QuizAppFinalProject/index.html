  <title>QuizApp</title>
  <link rel="stylesheet" href="stye.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>



  <div class="app-container">
    <div class="sidebar">
      <img src="img/QuizWard_logo.png">




      <ul>
        <li>
          <a href="">

          </a>
        </li>

        <li>
          <a href="">
            <!-- Plus Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19" />

        <li>

            </svg>
            My Quizzes
          </a>
        </li>

        <li>
          <a href="">
            <!-- Book Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path d="M4 4.5A2.5 2.5 0 0 1 6.5 7H20" />
              <path d="M20 22V2" />
            </svg>
            Question Bank
          </a>
        </li>

        <li>
          <a href="">
            <!-- Folder Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"

            </svg>
            Category
          </a>
        </li>

        <li>
          <a href="">
            <!-- Bar Chart Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

      <div id="dashboard-view" class="Wellcome-container">
        <div class="inner-wellcome-container">
          <H5>Welcome to QuizWard</H5>
          <p>Build your first quiz and start challenging minds.</p>
          <button>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              style="margin-right: 6px;">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Create Quiz
          </button>

        </div>
      </div>

    </div>

    <div class="body-container">
  <header>
          <h1>heelo</h1>
        </header>
      <div class="inner-body-container">
      

        <div class="dashboard-data-container">
          <div class="con1"> </div>
          <div class="con2"></div>
          <div class="con3"></div>
          <div class="con4"></div>
        </div>

        <div class="quiz-display-data-container">
         <div class="display1"></div>
          <div class="display2"></div>
        </div>

        <div class="quickaction-container">

             </div>
        </div>
        
      </div>

<script>
  import { createIcons, LayoutDashboard } from 'lucide';

  createIcons({
    icons: {
      LayoutDashboard
    }
  });
</script>

<i data-lucide="layout-dashboard"></i>
