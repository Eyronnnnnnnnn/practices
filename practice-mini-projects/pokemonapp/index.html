<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script type="module" src="./main.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>

        body {
            background-color: rgb(31, 31, 37);
            margin: 0;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 120px;
            background-color: rgb(240, 227, 45);
        }

        header img {
            max-width: 240px;
        }

        section {
            display: flex;
            width: 100%;
            height: 100%;


        }

        .left-container {
            width: 40%;
            height: 600px;
            /* background-color: aquamarine; */
        }

        .right-container {
            
             display: flex;
             align-items: center;
             justify-content: center;
            text-align: center;
            
            
            width: 100%;
            height: 600px;
        }
.right-container h1 {
    font-family: 'Anton', sans-serif;
    font-size: 80px;
    letter-spacing: 1px;
    word-spacing: 0px;
    color: #f5e50f;
    font-weight: normal;
    text-decoration: none;
    font-style: normal;
    font-variant: normal;
    text-transform: none;

    /* Essential Typewriter Properties */
    display: inline-block;
    width: 0;
    overflow: hidden;
    white-space: nowrap;
    border-right: 4px solid #f5e50f;

    /* Naka-set sa infinite alternate para tuloy-tuloy ang loop */
    animation: 
        typing 4s steps(30, end) infinite alternate,
        blink 0.75s step-end infinite;
}

/* Typing & Erasing movement */
@keyframes typing {
    0% { width: 0; }
    80% { width: 100%; }  /* Tapos na mag-type sa 80% */
    100% { width: 100%; } /* May kaunting pause bago mag-bura */
}

/* Blinking cursor effect */
@keyframes blink {
    from, to { border-color: transparent; }
    50% { border-color: #0e076c; }
}

        .right-container P {
            font-family: 'Courier New', Courier, monospace;
            color: aliceblue;
        }

        .right-content{
          
            height: 400px;
            
        }

        .pokemon-img-container {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 800px;
            height: 100%;
        }

        .pokemon-img-container img {
            width: 400px;
            border-radius: 30PX;
        }

        .form-container button{
            border: 0;
            height: 50px;
            width: 160px;
            background-color: #3e08a9;
            color: aliceblue;

        }
         .form-container input{
            border: 0;
            height: 40px;
            width: 300px;
        }

        .modal{
            display: none;
            justify-content: center;
            align-items: center;
           position: fixed;
          top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3); /* dim background */
      backdrop-filter: blur(2px);     /* blur effect */
      -webkit-backdrop-filter: blur(6px);
      z-index: 9999;
        }

        .modal-content{
            background: rgba(0, 0, 0, 0.358);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      margin: 10% auto;
      padding: 20px;
      width: 430px;
      height: 540px;
      text-align: center;
      color: #fff;
      animation: popup 0.4s ease;
            
        }

        
    </style>
</head>
