<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: rgb(31, 31, 37);
            margin: 0;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 120px;
            background-color: rgb(240, 227, 45);
        }

        header img {
            max-width: 240px;
        }

        section {
            display: flex;
            width: 100%;
            height: 100%;


        }

        .left-container {
            width: 40%;
            height: 600px;
            /* background-color: aquamarine; */
        }

        .right-container {
            
             display: flex;
             align-items: center;
             justify-content: center;
            text-align: center;
            
            
            width: 100%;
            height: 600px;
        }

        .right-container h1 {
            font-family: 'Anton', sans-serif;
            font-size: 80px;
            letter-spacing: 1px;
            word-spacing: 0px;
            color: #f5e50f;
            font-weight: NORMAL;
            text-decoration: none;
            font-style: normal;
            font-variant: normal;
            text-transform: none;
        }

        .right-container P {
            font-family: 'Courier New', Courier, monospace;
            color: aliceblue;
        }

        .right-content{
          
            height: 400px;
            
        }

        .pokemon-img-container {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 800px;
            height: 100%;
        }

        .pokemon-img-container img {
            width: 400px;
            border-radius: 30PX;
        }

        .form-container button{
            border: 0;
            height: 50px;
            width: 160px;
            background-color: #3e08a9;
            color: aliceblue;

        }
         .form-container input{
            border: 0;
            height: 40px;
            width: 300px;
        }

        
    </style>
</head>

<body>
    <header>
        <img src="https://1000logos.net/wp-content/uploads/2017/05/Pokemon-Logo.png" alt="">
    </header>

    <section>
        <div class="left-container">
            <div class="pokemon-img-container">
                <img src="https://i.gifer.com/EBR6.gif">
            </div>
        </div>
        <div class="right-container">
            <div class="right-content">
                <h1>WELCOME TO POKEMO</h1>
            <p>Where you can find your pokemon</p>
            <form class="form-container" action="">
                <input type="text" name="" id="">
                <button type="button">FIND POKEMO</button>
            </form>
            </div>
           
        </div>
    </section>
</body>

</html>
