<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Tracking</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        background-color: #20740a; /* Dark green background */
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        color: #fff;
      }

      .container {
        max-width: 900px;
        margin: 50px auto;
          background:   rgba(255, 252, 252, 0.718);
            backdrop-filter: blur(10px);       /* blur effect sa likod */
  -webkit-backdrop-filter: blur(40px); /
        padding: 30px;
        border-radius: 12px;
         border: 1px solid rgba(255, 255, 255, 0.2); /* frosted border */
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        color: #333;
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #224d06;
        font-size: 2rem;
        font-family: 'Times New Roman', Times, serif;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 8px;
      }

      th,
      td {
        padding: 14px;
        text-align: center;
      }

      th {
        background: #20740a;
        color: #fff;
        font-weight: 600;
        text-transform: uppercase;
      }

      tr {
        background: #eafbea;
        transition: background 0.3s ease;
      }

      tr:nth-child(even) {
        background: #d6f5d6;
      }

      tr:hover {
        background: #c8e6c9;
      }

      .btn {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.3s ease;
      }

      .btn-edit {
        background-color: #146603;
        color: #fff;
      }

      .btn-edit:hover {
        background-color: #8ce070;
      }

      .btn-delete {
        background-color: #d3a009;
        color: #fff;
        margin-left: 8px;
      }

      .btn-delete:hover {
        background-color: #c0392b;
      }

      #myChart {
        max-width: 900px;
        max-height: 300px;
      }

      #myChart label {
        background-color: rgb(23, 163, 23);
      }

      .editmodal {
        display: flex; /* nakatago by default */
        position: fixed;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 115, 35, 0.497); /* semi-transparent */
        backdrop-filter: blur(4px); /* blur effect */
        -webkit-backdrop-filter: blur(10px); /* Safari support */
        border: 1px solid rgba(255, 255, 255, 0.3); /* frosted border */
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); /* depth shadow */
          opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
      }

      .modalContent {
        background: rgb(230, 234, 230);
        margin: 15% auto;
        padding: 20px;
        border-radius: 8px;
        width: 700px;
        height: 400px;
        text-align: center;

        transform: scale(0.7);
        transition: transform 0.1s ease;

      }
      .editmodal.active {
  opacity: 1;
  pointer-events: auto;
}

.editmodal.active .modalContent {
  transform: scale(1); /* zoom in pop-up */
}

    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="sample"></h1>
      <img src="https://upload.wikimedia.org/wikipedia/commons/9/9d/1Seal.png" style="width: 200px; padding-left: 350px;" >
      <h1>MMSU STUDENT TRACKING</h1>
      
      <canvas id="myChart"></canvas>
      <table>
        <thead>
          <tr>
            <th>ID</th>

            <th>Status</th>
            <th>course</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-Body">
          <tr>
            <td>24-140104</td>
            <td>Aaron Guillermo</td>
            <td>Present</td>
            <td>BSIT</td>
            <td>
              <button class="btn btn-edit" id="btnedit">Edit</button>
              <button class="btn btn-delete" id="btndelete">Delete</button>
            </td>
          </tr>
          <tr>
            <td>24-123456</td>
            <td>Shane Boromeo</td>
            <td>Present</td>
            <td>BSNursing</td>
            <td>
              <button class="btn btn-edit" id="btnedit">Edit</button>
              <button class="btn btn-delete" id="btndelete">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="editmodal">
      <div class="modalContent"></div>
    </div>
  </body>

  <script>
    const ctx = document.getElementById("myChart");
    const sample = document.querySelector(".sample");
    const newId = 0;

    const overlay = document.querySelector(".editmodal");
    const modal = document.querySelector(".modalContent");
    

    let studentCourseCountBSIT = 32;

    let studentCourseCountBSNursing = 76;
    let studentCourseCountBSCivilEngr = 56;
    let studentCourseCountBSoRANGE = 68;

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: ["BSIT", "BSCS", "BSIS", "BSNursing", "BSCivilEng", "Orange"],
        datasets: [
          {
            label: "courses",
            data: [
              studentCourseCountBSIT,

              studentCourseCountBSCivilEngr,
              studentCourseCountBSoRANGE,
            ],
            borderWidth: 2,
            backgroundColor: "orange",
            borderRadius: 6,
          },
        ],
      },
      options: {

          },
        },
      },
    });

    const getTableBody = document.querySelector("#table-Body");

    const students = [
      {

      },
      {

      },
    ];

    function RenderStudents() {
      getTableBody.innerHTML = "";

      const row = students.map((student) => {
        return `<tr>
                  <td>${student.studentId}</td>
                  <td>${student.Name}</td>
                  <td>${student.Status}</td>
                  <td>${student.Course}</td>
                  <td><button class="btn btn-edit" id ="btnedit-${student.id}">Edit</button>
                      <button class="btn btn-delete">Delete</button>
                    </td>
                
               </tr>`;
      });

      getTableBody.innerHTML = row.join("");

      console.log(row);

      // dito is every student every student my event listener na nag a alert
      students.map((stud) => {
        let editbtn = document.querySelector(`#btnedit-${stud.id}`);
        editbtn.addEventListener("click", () => {
          overlay.classList.add("active");
          showModal();
        });
      });
    }

    function showModal() {
      
      overlay.style.display = "flex";
      modal.style.display = "flex";
      modal.style.flexDirection = "column";

    }
    // function for student add
    function studentAdd() {
      const newStudent = {

      };
    }

    function EditStudents(id) {
      let editedStudent = students.find((f) => f.id);

    }
    
    RenderStudents();
  </script>
</html>
