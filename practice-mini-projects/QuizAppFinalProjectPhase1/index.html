<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
        }

        .question {
            margin: 20px 0;
            font-size: 1.2em;
        }

        .options button {
            display: block;
            width: 100%;
            margin: 8px 0;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background: #1e3c72;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s;
        }

        .options button:hover {
            background: #2a5298;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-5px);
            }

            40% {
                transform: translateX(5px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .shake {
            animation: shake 0.4s ease;
            background: red;
            /* temporary color while shaking */
        }

        .score {
            text-align: center;
            font-size: 1.2em;
            margin-top: 20px;
        }

        .resetbtn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 120px;

        }

        .resetbtn-container button {
            width: 100px;
            height: 40px;
            font-size: 17px;
            font-family: Arial;
            width: 110px;
            height: 35px;
            border-width: 1px;
            color: rgba(255, 255, 255, 1);
            border-color: rgba(218, 56, 42, 1);
            font-weight: ;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            box-shadow: 0px 10px 14px -7px rgba(85, 78, 76, 1);
            text-shadow: 0px 1px 0px rgba(212, 102, 64, 1);
            background: linear-gradient(rgba(231, 19, 19, 1), rgba(180, 5, 5, 1));

        }

        .resetbtn-container button:hover {
            background: linear-gradient(rgba(180, 5, 5, 1), rgba(231, 19, 19, 1));
        }

        /* CSS Modal Styles - Generated with VexaX CSS Modal Generator */

        .modal-overlay {
          
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display:none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }


        .custom-modal {
            
            background-color: #ffffff;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            width: 300px;
            max-width: 95%;
            overflow: hidden;
            color: #333;
            font-size: 16px;
        }


        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            margin: 0;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6c757d;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #dee2e6;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }


        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1);
            }
        }

        .custom-modal {
            animation: bounceIn 0.5s ease-out;
        }

        .btn-modal-TryAgain {
            background-color: #1b6cf8;
            width: 60px;
            height: 40px;
            margin: 0;
            border: 0;
            color: #f4f4f4;
            border-radius: 8px;

        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .custom-modal {
                width: 95% !important;
                max-width: 95% !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Quiz App</h2>
        <!-- Question area -->
        <div id="quiz">
            <div class="question">Sample Question dito</div>
            <div class="options">
                <button>Choice A</button>
                <button>Choice B</button>
                <button>Choice C</button>
                <button>Choice D</button>
            </div>
        </div>

        <div class="score" id="score">
            <h5>Previous Score : 0</h5>
            <p>Score: 0 / 3</p> 
        </div>

        <div class="resetbtn-container">
            <button id="resetbtn">RESET</button>
        </div>
    </div>

    <!-- HTML Modal Structure - Generated with VexaX CSS Modal Generator -->
    <div class="modal-overlay">
        <div class="custom-modal">

            <div class="modal-header ">
                <h5 class="modal-title">Quiz Finish</h5>
                <button class="modal-close">×</button>
            </div>
            <div class="modal-body">
                <p>Your Total Score is : </p>
                
            </div>

            <div class="modal-footer">
                <button class="btn-modal-TryAgain">TRY AGAIN?</button>

            </div>
        </div>
    </div>
    </div>



</body>
<script type="module" src="Main.js">

</script>

</html>
