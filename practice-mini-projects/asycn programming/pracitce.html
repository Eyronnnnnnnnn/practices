<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
       
        margin: 0;
        background-color: rgb(23, 19, 59);
    }
    header{
        background-color: rgb(255, 255, 255);
        width: 100%;
        height: 80px;
    }

    .main-container{
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 600px;
      
    }

    .main-container button{
      background-color: rgb(255, 22, 162);
      margin: 0;
      border: 0;
      width: 100px;
      height: 30px;
      border-radius: 10px;
          }
</style>
<body>
    <header>

    </header>

    <div class="main-container">
        <input id="inputpass" type="password" placeholder="password">
        <button id="click-btn">click me</button>
    </div>
</body>
<script>

    const password = "Shutupshane";
    const getbtn = document.querySelector("#click-btn");
    const getinput = document.querySelector("#inputpass");

    
    getbtn.addEventListener("click",()=>{
     if(getinput.value === password){
        console.log("correct!!!");
     }else{console.log("wrong pass")}
    })
</script>

</html>
