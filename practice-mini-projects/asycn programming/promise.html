<script>

    const CheckAge = new Promise((resolve , reject)=>{
        let age = 15; 

        if (age >= 18){
        resolve("Pwede ka na mag-drive!");
        }else{
            reject("Hindi ka pa pwede mag-drive");
        }

    });

    
      CheckAge
      .then((result) =>{
        console.log(result);
      })

      .catch((error)=>{
        console.log(error);
      })

</script>
</html>
