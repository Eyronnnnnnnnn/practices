<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API PROJECT</title>
</head>

<body>

    <form action="">
        <input id="inputs" type="text" placeholder="Enter word">
        <button type="button" id="btn">submit</button>
    </form>



</body>

<script>
    const getinput = document.querySelector("#btn");
    const getvalue = document.querySelector("#inputs");






    getinput.addEventListener("click", async () => {
        try {
            const getinputdata = getvalue.value;
            const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${getinputdata}`);
            const data = await response.json();
            console.log(data);
        } catch (error) {
            console.log(error);
        }
    });





</script>

</html>
